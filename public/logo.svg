<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradFull" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#15193c" />
      <stop offset="100%" stop-color="#0a0c1a" />
    </radialGradient>

    <linearGradient id="neonGradFull" x1="15%" y1="90%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#818cf8" />
      <stop offset="85%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>

    <radialGradient id="auraGlowFull" cx="50%" cy="38%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32" />
      <stop offset="55%" stop-color="#a855f7" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0a0c1a" stop-opacity="0" />
    </radialGradient>

    <filter id="glowFull" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="textAuraGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="textAiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="800" height="600" fill="url(#bgGradFull)" />

  <!-- Aura Ring Behind A -->
  <circle cx="400" cy="225" r="170" fill="url(#auraGlowFull)" />
  <circle cx="400" cy="225" r="150" fill="none" stroke="url(#neonGradFull)" stroke-width="2" stroke-dasharray="10 14" opacity="0.4" />

  <!-- A Emblem -->
  <g filter="url(#glowFull)">
    <path d="M 285 350 L 378 105 C 386 85 414 85 422 105 L 515 350 C 519 360 509 370 498 366 L 466 354 C 460 352 455 346 452 340 L 432 285 L 368 285 L 348 340 C 345 346 340 352 334 354 L 302 366 C 291 370 281 360 285 350 Z"
          fill="none"
          stroke="url(#neonGradFull)"
          stroke-width="14"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <path d="M 382 248 L 400 190 L 418 248 Z"
          fill="#0e1124"
          stroke="url(#neonGradFull)"
          stroke-width="9"
          stroke-linejoin="round" />

    <path d="M 330 315 L 348 270 L 348 220 L 378 185"
          fill="none"
          stroke="#00f2fe"
          stroke-width="4.5"
          stroke-linecap="round"
          opacity="0.9" />
    <circle cx="330" cy="315" r="4.5" fill="#00f2fe" />
    <circle cx="348" cy="220" r="4" fill="#38bdf8" />
    <circle cx="378" cy="185" r="4" fill="#38bdf8" />

    <path d="M 470 315 L 452 270 L 452 220 L 422 185"
          fill="none"
          stroke="#e879f9"
          stroke-width="4.5"
          stroke-linecap="round"
          opacity="0.9" />
    <circle cx="470" cy="315" r="4.5" fill="#e879f9" />
    <circle cx="452" cy="220" r="4" fill="#c084fc" />
    <circle cx="422" cy="185" r="4" fill="#c084fc" />

    <line x1="360" y1="266" x2="440" y2="266" stroke="url(#neonGradFull)" stroke-width="4" stroke-linecap="round" />
    <circle cx="400" cy="266" r="4.5" fill="#ffffff" stroke="#c084fc" stroke-width="2.5" />
  </g>

  <!-- AuraAI Brand Typography -->
  <text x="400" y="475" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="82" letter-spacing="-1.5">
    <tspan fill="url(#textAuraGrad)">Aura</tspan><tspan fill="url(#textAiGrad)">AI</tspan>
  </text>

  <!-- Subtle Sparkle in Corner -->
  <path d="M 720 500 L 724 518 L 742 522 L 724 526 L 720 544 L 716 526 L 698 522 L 716 518 Z" fill="#818cf8" opacity="0.65" />
</svg>