<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141838" />
      <stop offset="100%" stop-color="#0a0c1a" />
    </radialGradient>

    <!-- Neon Cyan-Purple Stroke Gradient -->
    <linearGradient id="neonGrad" x1="15%" y1="90%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>

    <!-- Aura Halo Gradient -->
    <radialGradient id="auraGlow" cx="50%" cy="46%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0a0c1a" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer Glow Halo -->
  <circle cx="256" cy="245" r="175" fill="url(#auraGlow)" />
  <circle cx="256" cy="245" r="160" fill="none" stroke="url(#neonGrad)" stroke-width="1.8" stroke-dasharray="8 12" opacity="0.45" />

  <!-- Circuit Background Sparks -->
  <circle cx="205" cy="145" r="2.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="310" cy="155" r="2.5" fill="#c084fc" opacity="0.8" />
  <circle cx="150" cy="310" r="2" fill="#00f2fe" opacity="0.6" />
  <circle cx="365" cy="305" r="2" fill="#e879f9" opacity="0.6" />

  <!-- Futuristic Glowing "A" Outline -->
  <g filter="url(#glow)">
    <!-- Main A Shell -->
    <path d="M 125 390 L 230 115 C 238 95 274 95 282 115 L 387 390 C 392 402 380 412 368 408 L 332 396 C 324 394 319 387 316 380 L 292 315 L 220 315 L 196 380 C 193 387 188 394 180 396 L 144 408 C 132 412 120 402 125 390 Z"
          fill="none"
          stroke="url(#neonGrad)"
          stroke-width="15"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- A Inner Counter Triangle -->
    <path d="M 235 270 L 256 205 L 277 270 Z"
          fill="#0e1124"
          stroke="url(#neonGrad)"
          stroke-width="10"
          stroke-linejoin="round" />

    <!-- Circuit Board Traces & Nodes inside Left Leg -->
    <path d="M 175 350 L 195 300 L 195 240 L 230 200"
          fill="none"
          stroke="#00f2fe"
          stroke-width="5"
          stroke-linecap="round"
          opacity="0.9" />
    <circle cx="175" cy="350" r="5" fill="#00f2fe" />
    <circle cx="195" cy="240" r="4.5" fill="#38bdf8" />
    <circle cx="230" cy="200" r="4.5" fill="#38bdf8" />

    <!-- Circuit Board Traces & Nodes inside Right Leg -->
    <path d="M 337 350 L 317 300 L 317 240 L 282 200"
          fill="none"
          stroke="#e879f9"
          stroke-width="5"
          stroke-linecap="round"
          opacity="0.9" />
    <circle cx="337" cy="350" r="5" fill="#e879f9" />
    <circle cx="317" cy="240" r="4.5" fill="#c084fc" />
    <circle cx="282" cy="200" r="4.5" fill="#c084fc" />

    <!-- Crossbar Neural Node -->
    <line x1="210" y1="290" x2="302" y2="290" stroke="url(#neonGrad)" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="256" cy="290" r="5" fill="#ffffff" stroke="#c084fc" stroke-width="3" />
  </g>

  <!-- Sparkle Accent in bottom-right corner -->
  <path d="M 430 405 L 434 425 L 454 429 L 434 433 L 430 453 L 426 433 L 406 429 L 426 425 Z" fill="#818cf8" opacity="0.75" />
</svg>